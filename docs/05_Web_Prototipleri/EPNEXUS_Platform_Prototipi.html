<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EPNEXUS Fasilitatör Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#EFF1EE;
  --surface:#FFFFFF;
  --surface-2:#F7F8F6;
  --ink:#14201D;
  --ink-2:#3B4A46;
  --muted:#697773;
  --line:#D9DEDA;
  --line-soft:#E7EBE7;
  --accent:#0D6157;
  --accent-soft:#DCEBE7;
  --accent-ink:#094840;
  --gold:#A8751B;
  --gold-soft:#F5EAD3;
  --ok:#2F7A4D;
  --ok-soft:#E0F0E5;
  --warn:#A8681A;
  --warn-soft:#F8EBD7;
  --crit:#A93C2E;
  --crit-soft:#F8E3DF;
  --shadow:0 1px 2px rgba(20,32,29,.06), 0 8px 24px -12px rgba(20,32,29,.18);
  --shadow-lift:0 2px 6px rgba(20,32,29,.08), 0 18px 40px -18px rgba(20,32,29,.28);
  --r:10px;
  --r-lg:16px;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1614;
    --surface:#16211E;
    --surface-2:#1B2825;
    --ink:#E8EDEA;
    --ink-2:#B9C5C1;
    --muted:#8A9995;
    --line:#2A3A36;
    --line-soft:#233130;
    --accent:#4FBFA9;
    --accent-soft:#16342E;
    --accent-ink:#8FDCCB;
    --gold:#D9A94A;
    --gold-soft:#332812;
    --ok:#5FC286;
    --ok-soft:#173124;
    --warn:#D9A04A;
    --warn-soft:#33270F;
    --crit:#E08476;
    --crit-soft:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 44px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1614; --surface:#16211E; --surface-2:#1B2825;
  --ink:#E8EDEA; --ink-2:#B9C5C1; --muted:#8A9995;
  --line:#2A3A36; --line-soft:#233130;
  --accent:#4FBFA9; --accent-soft:#16342E; --accent-ink:#8FDCCB;
  --gold:#D9A94A; --gold-soft:#332812;
  --ok:#5FC286; --ok-soft:#173124;
  --warn:#D9A04A; --warn-soft:#33270F;
  --crit:#E08476; --crit-soft:#3A211C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 44px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1220px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .mk{
  width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:var(--f-body);font-weight:800;font-size:12px;flex:none;
}
:root[data-theme="dark"] .brand .mk, :root:not([data-theme="light"]) .brand .mk{color:#08201C}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .brand .mk{color:#fff}}

.modeswitch{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.modeswitch button{padding:5px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.modeswitch button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .modeswitch button[aria-pressed="true"]{color:#08201C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modeswitch button[aria-pressed="true"]{color:#08201C}}

.topspacer{flex:1}
.demopill{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--warn-soft);color:var(--warn);padding:4px 9px;border-radius:99px;white-space:nowrap;
}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}

.nxchip{
  display:flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent-ink);
  border-radius:99px;padding:5px 12px 5px 9px;font-weight:700;font-size:13px;
}
.nxchip .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);flex:none}
.nxchip.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}

/* public nav */
.pubnav{border-bottom:1px solid var(--line);background:var(--surface)}
.pubnav-in{max-width:1220px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.pubnav button{
  padding:11px 12px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.pubnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* layout */
.wrap{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.panel-layout{display:grid;grid-template-columns:212px 1fr;gap:26px;align-items:start}
@media (max-width:860px){.panel-layout{grid-template-columns:1fr;gap:16px}}

.sidenav{
  position:sticky;top:72px;display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;
}
@media (max-width:860px){.sidenav{position:static;flex-direction:row;overflow-x:auto;border-radius:var(--r)}}
.sidenav button{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;white-space:nowrap;
}
.sidenav button:hover{background:var(--surface-2)}
.sidenav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.sidenav .ic{width:18px;text-align:center;flex:none;opacity:.8}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.flat{border-radius:var(--r);padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:880px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:21px}
.lede{color:var(--ink-2);max-width:66ch}

.btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:14px;transition:filter .15s;
}
.btn:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn{color:#08201C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#08201C}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);
  border:1px solid var(--line-soft);
}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}

.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 8px}
td{padding:9px 10px;border-top:1px solid var(--line-soft);vertical-align:middle}
.tscroll{overflow-x:auto}
tbody tr.me{background:var(--accent-soft)}
tbody tr.me td{color:var(--accent-ink);font-weight:700}

input,select,textarea{
  width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field{margin-bottom:12px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:99px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ---------- public hero ---------- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:34px 28px;display:grid;grid-template-columns:1.25fr .95fr;gap:34px;align-items:center;
  position:relative;overflow:hidden;
}
@media (max-width:840px){.hero{grid-template-columns:1fr;padding:24px 18px;gap:22px}}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;font-weight:600}
.hero h1 em{font-style:normal;color:var(--accent);font-weight:700}
.hero .lede{margin-top:14px;font-size:16px}
.hero-cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

.chain{display:flex;flex-direction:column;gap:5px}
.chain .step{
  display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;
}
.chain .step .n{
  font-family:var(--f-mono);font-size:10px;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:1px 4px;flex:none;
}
.chain .step.hl{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.chain .arrow{text-align:center;color:var(--muted);font-size:11px;line-height:1}

.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:16px}
@media (max-width:640px){.statrow{grid-template-columns:repeat(2,1fr)}}
.statrow .s{background:var(--surface);padding:15px 16px}
.statrow .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.statrow .k{font-size:12px;color:var(--muted);margin-top:3px}

/* game cards */
.game{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.game .top{padding:16px 16px 0;display:flex;flex-direction:column;gap:8px}
.game .strip{height:5px}
.game h3{font-size:18px}
.game .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.game .meta{display:flex;gap:6px;flex-wrap:wrap}
.game .desc{font-size:13.5px;color:var(--ink-2)}
.contents{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:9px;margin-top:auto}

.skillbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.pips{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--accent)}

/* tier cards */
.tier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:11px}
.tier.feature{border-color:var(--accent);box-shadow:var(--shadow-lift);position:relative}
.tier.feature::before{
  content:"En çok seçilen";position:absolute;top:-10px;left:18px;background:var(--accent);color:#fff;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;
}
:root[data-theme="dark"] .tier.feature::before{color:#08201C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tier.feature::before{color:#08201C}}
.tier .price{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.tier .price small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
.tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink-2);flex:1}
.tier li{display:flex;gap:8px;align-items:flex-start}
.tier li::before{content:"";width:15px;height:15px;border-radius:50%;background:var(--accent-soft);flex:none;margin-top:2px;
  background-image:linear-gradient(45deg,transparent 44%,var(--accent) 44%,var(--accent) 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--accent) 44%,var(--accent) 56%,transparent 56%);
  background-size:7px 2px,7px 2px;background-position:3px 8px,6px 7px;background-repeat:no-repeat}

/* rank ring */
.rank{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.15}
.ring .mid b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block}
.ring .mid span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.ladder{display:flex;flex-direction:column;gap:3px;min-width:190px;flex:1}
.rung{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 9px;border-radius:7px;color:var(--muted)}
.rung.done{color:var(--ink-2)}
.rung.cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.rung .t{flex:1}
.rung .req{font-family:var(--f-mono);font-size:11px}

.todo{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.todo .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:15px}
.todo .t{flex:1;min-width:0}
.todo .t b{display:block;font-size:14px}
.todo .t span{font-size:12.5px;color:var(--muted)}

.feed{display:flex;flex-direction:column}
.feed .row{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.feed .row:first-child{border-top:0}
.feed .row .amt{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--accent);white-space:nowrap}

/* modules */
.mod{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mod .code{
  font-family:var(--f-mono);font-size:12px;font-weight:500;width:34px;height:34px;border-radius:8px;
  display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-soft);
}
.mod.done .code{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.mod.cur .code{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.mod .info{flex:1;min-width:0}
.mod .info b{display:block;font-size:14.5px}
.mod .info span{font-size:12.5px;color:var(--muted)}

/* badges */
.badge{
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  padding:15px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
.badge .em{font-size:26px;line-height:1;filter:grayscale(1);opacity:.32}
.badge.have .em{filter:none;opacity:1}
.badge b{font-size:12.5px;line-height:1.25}
.badge span{font-size:11px;color:var(--muted)}
.badge.have{border-color:var(--accent)}
.badge.rare.have{border-color:var(--gold);background:var(--gold-soft)}

/* store */
.prod{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.prod .sw{width:42px;height:42px;border-radius:9px;flex:none}
.prod .nm{flex:1;min-width:150px}
.prod .nm b{display:block;font-size:14.5px}
.prod .nm span{font-size:12px;color:var(--muted)}
.prod .pr{text-align:right;min-width:118px}
.prod .pr b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.prod .pr del{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.note{
  border-left:3px solid var(--gold);background:var(--gold-soft);color:var(--ink-2);
  padding:11px 14px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;
}
.note b{color:var(--ink)}

.dirfacil{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--accent-soft);color:var(--accent-ink)}

.faq{border-top:1px solid var(--line-soft);padding:12px 0}
.faq:first-of-type{border-top:0}
.faq b{display:block;font-size:14.5px;margin-bottom:4px}
.faq p{font-size:13.5px;color:var(--ink-2)}

footer.site{border-top:1px solid var(--line);margin-top:48px;padding:22px 0;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="mk">EP</span>EPNEXUS</div>
    <div class="modeswitch" role="group" aria-label="Görünüm">
      <button id="mSite" aria-pressed="true">Site</button>
      <button id="mPanel" aria-pressed="false">Fasilitatör Paneli</button>
    </div>
    <div class="topspacer"></div>
    <span class="demopill">Prototip · demo verisi</span>
    <div id="nxChip" class="nxchip" hidden><span class="dot"></span><span class="num" id="nxVal">0</span> NX</div>
    <button class="iconbtn" id="themeBtn" title="Tema değiştir" aria-label="Tema değiştir">◐</button>
  </div>
</div>

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2100);
}
function addNX(n,msg){
  S.nx+=n;
  const c=$('#nxChip'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  $('#nxVal').textContent=tl(S.nx);
  toast(msg+'  +'+n+' NX');
}
function rankOf(nx){
  let cur=RANKS[0], nxt=RANKS[1];
  RANKS.forEach((r,i)=>{ if(nx>=r.min){cur=r; nxt=RANKS[i+1]||null;} });
  return {cur,nxt};
}

  if(S.mode==='site'){
    const map={ana:pageAna,oyunlar:pageOyunlar,fasilitator:pageFasilitator,dizin:pageDizin,lig:pageLigPublic};
    app.innerHTML = (map[S.page]||pageAna)() + `<footer class="site">EPNEXUS · Education Phygital Games · Prototip sürümü — demo verisiyle doldurulmuştur. Oyun içerikleri ve fiyatlar EPNEXUS Ürün Kataloğu (Ağustos 2026) kaynaklıdır.</footer>`;
  } else {
    const map={dash:pageDash,akademi:pageAkademi,rapor:pageRapor,atolye:pageAtolye,rozet:pageRozet,liglig:pageLigPanel,magaza:pageMagaza,yonetim:pageYonetim};
    app.innerHTML = `<div class="panel-layout">
      <nav class="sidenav">${PAN.map(([k,i,l])=>`<button data-pgo="${k}" ${S.ppage===k?'aria-current="page"':''}><span class="ic">${i}</span>${l}</button>`).join('')}</nav>
      <div>${(map[S.ppage]||pageDash)()}</div>
    </div>`;
  }
  const key = S.mode+'/'+(S.mode==='site'?S.page:S.ppage);
  if(render._last !== key){ window.scrollTo({top:0,behavior:'instant'}); render._last = key; }
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-pgo],[data-mod],[data-act],[data-lt],[data-mt],[data-tas],[data-spend],[data-enroll]');
  if(!t) return;

  if(t.dataset.tas){
    const keys=['kart','proto','kural','test','rev'];
    S.tasarim[keys[+t.dataset.tas]]=true; render(); toast('Adım tamamlandı.'); return;
  }

  if(t.dataset.go){ S.mode='site'; S.page=t.dataset.go; render(); return; }
  if(t.dataset.pgo){ S.mode='panel'; S.ppage=t.dataset.pgo; render(); return; }
  if(t.dataset.lt){ S.leagueTab=t.dataset.lt; render(); return; }
  if(t.dataset.mt){ S.modTab=t.dataset.mt; render(); return; }

  if(t.dataset.mod){
    const k=t.dataset.mod;
    if(!S.doneModules.includes(k)){
      S.doneModules.push(k);
      addNX(100,k+' tamamlandı.');
      render();
    }
    return;
  }
  if(t.dataset.spend){
    const v=+t.dataset.spend;
    if(S.nx>=v){ S.nx-=v; $('#nxVal').textContent=tl(S.nx); toast(t.dataset.label+' — '+tl(v)+' NX düşüldü.'); render(); }
    return;
  }
  if(t.dataset.enroll){
    S.mode='panel'; S.ppage='akademi'; render();
    toast(t.dataset.enroll+' başvurusu — akademiye yönlendirildiniz.');
    return;
  }
  if(t.dataset.act){ toast(t.dataset.act); return; }
});

document.addEventListener('change',e=>{
  if(e.target.id==='tierSel'){ S.storeTier=e.target.value; render(); }
});

document.addEventListener('submit',e=>e.preventDefault());

$('#app').addEventListener('click',e=>{
  if(e.target.id==='tasGonder'){
    S.tasarim.gonderildi=true; render(); addNX(500,'Varyantınız jüriye gönderildi.');
    setTimeout(()=>{ toast('Jüri kabul etti — havuza 🌱 Tohum düzeyinde eklendi.'); },3000);
    return;
  }
  if(e.target.id!=='rSubmit') return;
  const oyun=$('#rOyun').value, okul=$('#rOkul').value.trim()||'—', sinif=$('#rSinif').value.trim()||'—', kisi=+$('#rKisi').value||0;
  const d=new Date();
  S.reports.unshift({oyun,okul,sinif,kisi,tarih:d.toLocaleDateString('tr-TR'),durum:'bekliyor'});
  render();
  toast('Rapor gönderildi — Master onayı bekliyor.');
  setTimeout(()=>{
    const r=S.reports.find(x=>x.durum==='bekliyor'&&x.oyun===oyun);
    if(r){ r.durum='onayli'; addNX(300,'Raporunuz onaylandı.'); if(S.ppage==='rapor') render(); }
  },2600);
});

$('#mSite').onclick=()=>{S.mode='site';render()};
$('#mPanel').onclick=()=>{S.mode='panel';render()};
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
};

render();
</script>
</body>
</html>
